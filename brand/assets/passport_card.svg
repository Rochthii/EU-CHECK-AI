<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0F172A; border-radius: 20px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="passBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="760" height="440" rx="16" fill="url(#cardBg)" stroke="#059669" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Top Header Bar -->
  <rect x="20" y="20" width="760" height="70" rx="16" fill="#059669" opacity="0.15"/>
  <text x="50" y="62" fill="#10B981" font-size="20" font-weight="800" letter-spacing="1">EUDR COMPLIANCE PASSPORT</text>
  <text x="550" y="62" fill="#94A3B8" font-size="14" font-family="'JetBrains Mono', monospace">ID: EUDR-2026-COFFEE-8942</text>

  <!-- Left Column: Details -->
  <g transform="translate(50, 120)">
    <!-- Item 1 -->
    <text x="0" y="20" fill="#64748B" font-size="12" font-weight="600">DOANH NGHIỆP XUẤT KHẨU</text>
    <text x="0" y="42" fill="#F8FAFC" font-size="16" font-weight="700">TẬP ĐOÀN CÀ PHÊ TÂY NGUYÊN (EXPORT CO.)</text>

    <!-- Item 2 -->
    <text x="0" y="90" fill="#64748B" font-size="12" font-weight="600">LÔ HÀNG &amp; CHỦNG LOẠI</text>
    <text x="0" y="112" fill="#F8FAFC" font-size="16" font-weight="700">20x Container Robusta Grade 1 (400 Tấn)</text>

    <!-- Item 3 -->
    <text x="0" y="160" fill="#64748B" font-size="12" font-weight="600">BẢN ĐỒ ĐỊA LÝ &amp; THỜI HẠN ĐẤT</text>
    <text x="0" y="182" fill="#10B981" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="600">124 Polygons Verified (Copernicus 2020 PASS)</text>
    <text x="0" y="202" fill="#10B981" font-size="14" font-family="'JetBrains Mono', monospace" font-weight="600">Gemini OCR: Hợp đồng nông hộ Hạn 2030</text>

    <!-- Item 4 -->
    <text x="0" y="250" fill="#64748B" font-size="12" font-weight="600">CĂN CỨ PHÁP LÝ CHIẾN LƯỢC</text>
    <text x="0" y="272" fill="#CBD5E1" font-size="13" font-weight="500">EUDR Art. 3(b), Art. 9(1)(d), Art. 10 &amp; Art. 31 (Lưu trữ 5 năm)</text>
  </g>

  <!-- Right Column: Readiness Score Badge & QR Code -->
  <g transform="translate(520, 120)">
    <!-- Score Circle Card -->
    <rect width="210" height="150" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <text x="105" y="35" fill="#94A3B8" font-size="12" font-weight="700" text-anchor="middle">READINESS SCORE</text>
    
    <text x="105" y="95" fill="#10B981" font-size="52" font-weight="900" text-anchor="middle">98<tspan font-size="24" fill="#64748B">/100</tspan></text>
    
    <rect x="40" y="110" width="130" height="28" rx="14" fill="url(#passBadgeGrad)"/>
    <text x="105" y="129" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">STATUS: PASS</text>

    <!-- QR Code Mockup -->
    <g transform="translate(45, 175)">
      <rect width="120" height="120" rx="8" fill="#FFFFFF"/>
      <!-- QR Blocks -->
      <rect x="10" y="10" width="35" height="35" fill="#0F172A"/>
      <rect x="17" y="17" width="21" height="21" fill="#FFFFFF"/>
      <rect x="23" y="23" width="9" height="9" fill="#0F172A"/>
      
      <rect x="75" y="10" width="35" height="35" fill="#0F172A"/>
      <rect x="82" y="17" width="21" height="21" fill="#FFFFFF"/>
      <rect x="88" y="23" width="9" height="9" fill="#0F172A"/>

      <rect x="10" y="75" width="35" height="35" fill="#0F172A"/>
      <rect x="17" y="82" width="21" height="21" fill="#FFFFFF"/>
      <rect x="23" y="88" width="9" height="9" fill="#0F172A"/>

      <rect x="55" y="55" width="12" height="12" fill="#059669"/>
      <rect x="75" y="75" width="15" height="15" fill="#0F172A"/>
      <rect x="95" y="95" width="15" height="15" fill="#0F172A"/>
      <rect x="55" y="95" width="12" height="15" fill="#059669"/>
    </g>
  </g>

  <!-- Bottom Footer Seal -->
  <line x1="50" y1="420" x2="750" y2="420" stroke="#1E293B" stroke-width="1"/>
  <text x="50" y="442" fill="#64748B" font-size="11" font-weight="500">COFFEE EU-CHECK AI • PRE-AUDIT VERIFIED SYSTEM • ROW-LEVEL SECURITY ENFORCED</text>
</svg>
