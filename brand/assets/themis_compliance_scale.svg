<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background:#0F172A; border-radius: 20px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.4"/>
      <circle cx="40" cy="0" r="1.5" fill="#059669" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" rx="20" fill="url(#techGrid)"/>

  <!-- Glowing Radial Backdrop behind Scale -->
  <circle cx="380" cy="300" r="220" fill="#059669" opacity="0.12" filter="blur(50px)"/>

  <!-- Left Side: THE MODERN TECH COMPLIANCE SCALE (CÁN CÂN TUÂN THỦ) -->
  <g transform="translate(140, 70)">
    <!-- Scale Pillar Center -->
    <!-- Base -->
    <path d="M 180 430 L 300 430 L 270 410 L 210 410 Z" fill="#334155" stroke="#10B981" stroke-width="1.5"/>
    <rect x="220" y="430" width="40" height="15" rx="3" fill="url(#emeraldGoldGrad)"/>
    
    <!-- Central Pillar -->
    <rect x="233" y="150" width="14" height="260" rx="7" fill="url(#emeraldGoldGrad)" filter="url(#emeraldGlow)"/>
    <rect x="237" y="160" width="6" height="240" fill="#FFFFFF" opacity="0.3"/>

    <!-- Central Top Crown Ornament (Modernized Tech Finial) -->
    <polygon points="240,90 255,130 240,145 225,130" fill="url(#goldGlow)"/>
    <circle cx="240" cy="130" r="6" fill="#FFFFFF"/>

    <!-- Horizontal Scale Beam -->
    <path d="M 60,170 C 150,150 330,150 420,170 C 430,172 430,182 420,184 C 330,164 150,164 60,184 C 50,182 50,172 60,170 Z" fill="url(#emeraldGoldGrad)"/>
    
    <!-- Fulcrum Center Ring -->
    <circle cx="240" cy="177" r="14" fill="#0F172A" stroke="#10B981" stroke-width="4"/>
    <circle cx="240" cy="177" r="5" fill="#F59E0B"/>

    <!-- LEFT SCALE PAN: AGRICULTURE & GIS POLYGON -->
    <!-- Strings -->
    <line x1="70" y1="182" x2="20" y2="320" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="70" y1="182" x2="120" y2="320" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Pan Bowl -->
    <path d="M 10,320 Q 70,365 130,320 Z" fill="#1E293B" stroke="#10B981" stroke-width="3"/>
    <path d="M 15,320 L 125,320" stroke="#059669" stroke-width="2"/>
    
    <!-- Left Pan Items: Coffee Cherries & GIS Polygon Mesh -->
    <g transform="translate(30, 240)">
      <!-- GIS Polygon Overlay -->
      <polygon points="40,10 70,25 65,65 25,75 10,40" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="40" cy="10" r="3" fill="#34D399"/>
      <circle cx="70" cy="25" r="3" fill="#34D399"/>
      <circle cx="65" cy="65" r="3" fill="#34D399"/>
      <circle cx="25" cy="75" r="3" fill="#34D399"/>
      <circle cx="10" cy="40" r="3" fill="#34D399"/>

      <!-- Ripe Coffee Cherries & Leaves -->
      <path d="M 35,50 C 25,35 15,45 25,55 Z" fill="#059669"/>
      <circle cx="35" cy="65" r="9" fill="#EF4444"/>
      <circle cx="32" cy="62" r="3" fill="#FCA5A5" opacity="0.7"/>
      
      <circle cx="50" cy="68" r="8" fill="#DC2626"/>
      <circle cx="48" cy="66" r="2.5" fill="#FCA5A5" opacity="0.7"/>

      <circle cx="42" cy="58" r="7.5" fill="#B91C1C"/>
      <circle cx="62" cy="62" r="8.5" fill="#10B981"/> <!-- Green Raw Coffee Cherry -->
    </g>

    <!-- RIGHT SCALE PAN: LAW & AI COMPLIANCE -->
    <!-- Strings -->
    <line x1="410" y1="182" x2="360" y2="320" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="410" y1="182" x2="460" y2="320" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Pan Bowl -->
    <path d="M 350,320 Q 410,365 470,320 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <path d="M 355,320 L 465,320" stroke="#D97706" stroke-width="2"/>

    <!-- Right Pan Items: EUDR Law Book & AI Gavel Shield -->
    <g transform="translate(370, 240)">
      <!-- Book Base (EUDR Regulation) -->
      <rect x="10" y="50" width="65" height="28" rx="4" fill="#059669" stroke="#34D399" stroke-width="1.5"/>
      <rect x="15" y="45" width="65" height="10" rx="2" fill="#F8FAFC"/>
      <text x="42" y="68" fill="#FFFFFF" font-size="9" font-weight="800" text-anchor="middle">EUDR ART. 9</text>

      <!-- Gavel / AI Audit Shield -->
      <path d="M 42,10 L 62,22 L 62,40 L 42,50 L 22,40 L 22,22 Z" fill="#F59E0B" opacity="0.9"/>
      <path d="M 33,30 L 40,37 L 52,22" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Right Side: BRAND TYPOGRAPHY & POSITIONING -->
  <g transform="translate(640, 180)">
    <!-- Tag Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#059669" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="110" y="22" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">EUDR &amp; CBAM PRE-AUDIT</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#FFFFFF" font-size="44" font-weight="900" letter-spacing="-1">Coffee <tspan fill="#10B981">EU-Check</tspan></text>
    
    <!-- AI Tag -->
    <rect x="365" y="52" width="60" height="42" rx="10" fill="#1E293B" stroke="#059669" stroke-width="2"/>
    <text x="395" y="80" fill="#10B981" font-size="22" font-weight="800" text-anchor="middle">AI</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="140" fill="#94A3B8" font-size="18" font-weight="500" width="480">
      <tspan x="0" dy="0">Hệ Thống Tiền Kiểm Toán AI &amp; GIS Độc Lập</tspan>
      <tspan x="0" dy="28" fill="#CBD5E1" font-weight="600">Cán Cân Tuân Thủ Cho Cà Phê Việt Nam</tspan>
    </text>

    <!-- 3 Key Badges -->
    <g transform="translate(0, 210)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="20" r="6" fill="#10B981"/>
      <text x="34" y="25" fill="#F8FAFC" font-size="12" font-weight="700">Art 9 Polygon</text>

      <!-- Badge 2 -->
      <rect x="150" y="0" width="140" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="170" cy="20" r="6" fill="#F59E0B"/>
      <text x="184" y="25" fill="#F8FAFC" font-size="12" font-weight="700">Gemini OCR</text>

      <!-- Badge 3 -->
      <rect x="300" y="0" width="150" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="320" cy="20" r="6" fill="#34D399"/>
      <text x="334" y="25" fill="#F8FAFC" font-size="12" font-weight="700">Mass Balance</text>
    </g>
  </g>
</svg>
