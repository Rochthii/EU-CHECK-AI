<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" style="background:#0F172A; border-radius: 16px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Background Pattern Grid -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="800" height="240" rx="16" fill="#0F172A"/>
  <rect width="800" height="240" rx="16" fill="url(#grid)" opacity="0.6"/>

  <!-- Logo Mark Container -->
  <g transform="translate(60, 45)">
    <!-- Polygon GIS Outer Ring -->
    <polygon points="75,5 135,35 145,100 95,145 25,130 5,65" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    
    <!-- Coffee Bean & Checkmark Shield Base -->
    <path d="M 75,15 C 115,15 135,45 135,85 C 135,125 95,145 75,145 C 55,145 15,125 15,85 C 15,45 35,15 75,15 Z" fill="url(#emeraldGrad)" filter="url(#shadow)"/>
    
    <!-- Coffee Bean Center Curved Cut -->
    <path d="M 75,25 C 60,55 90,95 75,135" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Geometric GIS Points -->
    <circle cx="75" cy="5" r="4" fill="#10B981"/>
    <circle cx="135" cy="35" r="4" fill="#10B981"/>
    <circle cx="145" cy="100" r="4" fill="#10B981"/>
    <circle cx="95" cy="145" r="4" fill="#10B981"/>
    <circle cx="25" cy="130" r="4" fill="#10B981"/>
    <circle cx="5" cy="65" r="4" fill="#10B981"/>

    <!-- Checkmark Overlay -->
    <path d="M 45,80 L 65,100 L 105,55" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(230, 95)">
    <text x="0" y="0" fill="#FFFFFF" font-size="40" font-weight="800" letter-spacing="-0.5">Coffee <tspan fill="#10B981">EU-Check</tspan></text>
    <rect x="330" y="-32" width="60" height="38" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
    <text x="360" y="-7" fill="#10B981" font-size="20" font-weight="700" text-anchor="middle">AI</text>
    
    <text x="0" y="35" fill="#94A3B8" font-size="16" font-weight="500" letter-spacing="0.2">EUDR &amp; CBAM PRE-AUDIT PLATFORM FOR VIETNAM COFFEE</text>
  </g>
</svg>
